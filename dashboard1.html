<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Generic KPI Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #024476;
            --primaryLeft: #fbc100;
            --accent: #2f7d32;
            --bg: #eef1f6;
            --card: #fff;
            --line: #d9e0e8;
            --text: #1f2937;
            --muted: #667085
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial,Helvetica,sans-serif;
            background: var(--bg);
            color: var(--text)
        }

        .header {
            background: var(--primary);
            color: #fff;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            position: sticky;
            top: 0;
            z-index: 100
        }

            .header h1 {
                font-size: 20px;
                margin: 0
            }

        .subtitle {
            font-size: 13px;
            opacity: .9
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .header a, .header button {
            color: #fff
        }

        .sheet-link {
            font-size: 13px;
            font-weight: 700
        }

        .how-button {
            border: 1px solid rgba(255,255,255,.65);
            background: rgba(255,255,255,.14);
            border-radius: 8px;
            padding: 9px 12px;
            font-weight: 800;
            cursor: pointer
        }

        .qr {
            width: 72px;
            height: 72px;
            background: #fff;
            padding: 4px;
            border-radius: 8px
        }

        .page {
            max-width: 1500px;
            margin: auto;
            padding: 14px
        }

        .card, .score-card, .section-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,.04)
        }

        .story-card {
            border-left: 6px solid var(--primary);
            margin-bottom: 12px
        }

            .story-card h2 {
                font-size: 18px;
                margin: 0 0 6px
            }

            .story-card p {
                margin: 0;
                color: var(--muted)
            }

        .top-summary-row {
            display: grid;
            grid-template-columns: minmax(0,1fr) 235px;
            gap: 12px;
            margin-bottom: 12px;
            align-items: stretch
        }

            .top-summary-row .story-card {
                margin-bottom: 0
            }

        .briefing-summary-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100%
        }

            .briefing-summary-card:hover {
                border-color: var(--primary);
                box-shadow: 0 2px 7px rgba(2,68,118,.14)
            }

            .briefing-summary-card .score-value {
                margin-top: 4px;
                font-size: 27px
            }

        .score-row {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
            gap: 12px;
            margin-bottom: 12px
        }

        .score-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
        }

            .score-card:hover {
                transform: translateY(-2px);
                border-color: var(--primary);
                box-shadow: 0 4px 12px rgba(2,68,118,.16);
            }

            .score-card:active {
                transform: translateY(0);
            }

            .score-card.overall {
                background: linear-gradient(135deg, var(--primary), #1769a0);
                color: #fff;
                padding: 17px;
                box-shadow: 0 3px 10px rgba(2,68,118,.18);
            }

            .score-card.overall:hover {
                border-color: rgba(255,255,255,.9);
                box-shadow: 0 5px 14px rgba(2,68,118,.28);
            }

                .score-card.overall .score-value {
                    font-size: 39px
                }

        .score-label-row {
            min-height: 45px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 4px;
            font-size: 13px;
        }

        .score-label {
            flex: 0 1 auto;
            min-width: 0;
            line-height: 1.15;
        }



        .overall .score-label, .overall .score-note {
            color: #eef
        }

        .score-value {
            font-size: 34px;
            font-weight: 800;
            line-height: 1;
        }

        .score-note {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
            min-height: 34px;
        }

        .meter {
            height: 8px;
            background: #e8edf3;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 10px
        }

        .meter-fill {
            height: 100%;
            background: var(--accent)
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
            gap: 12px
        }

            .dashboard-grid.sections-1 {
                grid-template-columns: 1fr
            }

            .dashboard-grid.sections-2 {
                grid-template-columns: repeat(2,minmax(0,1fr))
            }

            .dashboard-grid.sections-3 {
                grid-template-columns: repeat(3,minmax(0,1fr))
            }

            .dashboard-grid.sections-4 {
                grid-template-columns: repeat(2,minmax(0,1fr))
            }

            .dashboard-grid.sections-5, .dashboard-grid.sections-6 {
                grid-template-columns: repeat(3,minmax(0,1fr))
            }

        .section-card h3 {
            margin: 0
        }

        .section-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px
        }

        .section-question {
            margin: 0 0 12px;
            font-size: 13px;
            color: var(--muted)
        }

        .kpi-list {
            display: grid;
            gap: 10px
        }

        .kpi-row {
            display: grid;
            grid-template-columns: 42px 1fr auto;
            gap: 10px;
            border-top: 1px solid #edf1f5;
            padding-top: 10px
        }

            .kpi-row:first-child {
                border-top: 0
            }

        .kpi-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #eef0ff;
            color: var(--primary)
        }

        .kpi-title {
            font-weight: 800
        }

        .kpi-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0
        }



        .info-title-link:hover,
        .info-title-link:focus-visible {
            color: var(--primary);
            text-decoration: none;
        }

        .info-title-link:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
            border-radius: 3px;
            margin-left: 4px;
            vertical-align: baseline;
        }



            .info-title-link:hover .info-cue,
            .info-title-link:focus-visible .info-cue {
                opacity: 1;
                transform: scale(1.12);
            }

        .info-title-link {
            appearance: none;
            border: 0;
            background: transparent;
            padding: 0;
            margin: 0;
            color: inherit;
            font: inherit;
            font-weight: inherit;
            line-height: inherit;
            text-align: left;
            cursor: pointer;
            text-decoration: none;
            display: inline;
        }

        .info-cue {
            color: var(--primary);
            font-size: 12px;
            opacity: .72;
            margin-left: 4px;
            vertical-align: baseline;
            transition: opacity .15s ease, transform .15s ease;
        }

        .score-card.overall .info-title-link:hover,
        .score-card.overall .info-title-link:focus-visible {
            color: #fff;
        }

        .score-card.overall .info-cue {
            color: #fff;
            opacity: .8;
        }

        .section-title-link,
        .metric-title-link,
        .calculation-title-link {
            font-weight: 800;
        }

        .kpi-sub {
            font-size: 12px;
            color: var(--muted)
        }

        .kpi-value {
            text-align: right;
            font-size: 20px;
            font-weight: 800
        }

        .kpi-asof {
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap
        }

        .kpi-compare {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 6px;
            margin-top: 8px
        }

            .kpi-compare > div {
                background: #f7f9fc;
                border: 1px solid #e5eaf0;
                border-radius: 7px;
                padding: 6px
            }

        .compare-label {
            font-size: 10px;
            color: var(--muted)
        }

        .compare-value {
            font-size: 12px;
            font-weight: 800
        }

        .callout {
            margin-top: 12px;
            background: #f7f8ff;
            border: 1px solid #dedffd;
            border-radius: 9px;
            padding: 10px;
            font-size: 13px
        }

        .trend-card {
            margin-top: 12px
        }

        .footer-note {
            font-size: 12px;
            color: var(--muted);
            margin-top: 12px
        }

        .detail-card, .brief-card {
            margin-bottom: 12px
        }

        .detail-head {
            display: flex;
            justify-content: space-between;
            gap: 12px
        }

        .detail-title-row {
            display: flex;
            align-items: center;
            gap: 8px
        }

            .detail-title-row h3 {
                margin: 0
            }

        .detail-close {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer
        }

        .calc-grid, .brief-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 10px;
            margin-top: 10px
        }

        .calc-item, .brief-item {
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 10px;
            background: #fafbfd
        }

        .calc-line {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            padding: 3px 0
        }

        .calc-score {
            font-size: 22px;
            font-weight: 800;
            border-top: 1px solid #e7ebf0;
            margin-top: 8px;
            padding-top: 8px
        }

        .brief-meta {
            font-size: 11px;
            color: var(--muted);
            display: flex;
            justify-content: space-between
        }

        .brief-title {
            font-weight: 800;
            margin: 5px 0
        }

        .brief-details {
            font-size: 13px;
            color: var(--muted)
        }

        .index-calculation {
            margin-top: 12px;
            margin-bottom: 14px
        }

        .calculation-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid #b8d6ee;
            border-left: 6px solid var(--primary);
            border-radius: 10px;
            background: #f7fbff
        }

        .calculation-summary-label {
            font-size: 13px;
            color: var(--muted)
        }

        .calculation-summary-title {
            font-size: 16px;
            font-weight: 800
        }

        .calculation-summary-value {
            font-size: 30px;
            font-weight: 800;
            white-space: nowrap
        }

        .calculation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
            gap: 10px
        }

        .calculation-item {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px;
            background: #fff
        }

        .calculation-item-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 8px
        }

        .calculation-item-title {
            font-size: 14px;
            font-weight: 800
        }

        .calculation-line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 3px 0;
            font-size: 12px;
            color: var(--muted)
        }

            .calculation-line strong {
                color: var(--text);
                text-align: right
            }

        .calculation-date {
            font-size: 10px;
            font-weight: 400;
            color: var(--muted);
            margin-top: 1px
        }

        .calculation-score {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e8eef4;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px
        }

            .calculation-score strong {
                font-size: 22px
            }

        .calculation-math {
            margin-top: 3px;
            font-size: 11px;
            line-height: 1.25;
            color: var(--muted);
            text-align: right
        }

            .calculation-math strong {
                color: var(--text)
            }

        .calculation-contribution {
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px dashed #e1e8ef
        }

        .calculation-formula {
            margin: 10px 0 0;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.35
        }

        .detail-chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
            gap: 12px;
            margin-top: 12px
        }

        .detail-mini-chart {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            background: #f8fbfe;
            min-height: 250px
        }

        .detail-mini-chart-title {
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 6px
        }

        .detail-mini-chart canvas {
            max-height: 210px
        }

        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.35);
            display: none;
            z-index: 199
        }

            .drawer-backdrop.open {
                display: block
            }

        .drawer {
            position: fixed;
            top: 0;
            right: -540px;
            width: 520px;
            max-width: 94vw;
            height: 100vh;
            background: #fff;
            z-index: 200;
            transition: right .2s;
            display: flex;
            flex-direction: column;
            margin-top: 108px;
        }

            .drawer.open {
                right: 0
            }

        .drawer-head {
            padding: 14px;
            border-bottom: 1px solid var(--line);
            border-left: 0px solid var(--primary);
            display: flex;
            justify-content: space-between;
        }

        .drawer-body {
            overflow: auto;
            padding: 14px
        }

        .help-section {
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 11px;
            margin-bottom: 10px
        }

        .metric-info-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.35);
            display: none;
            z-index: 209
        }

            .metric-info-backdrop.open {
                display: block
            }

        .metric-info-drawer {
            position: fixed;
            top: 0;
            right: -540px;
            width: 520px;
            max-width: 94vw;
            height: 100vh;
            background: #fff;
            z-index: 210;
            transition: right .2s;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(15,23,42,.2);
            margin-top: 108px;
        }

            .metric-info-drawer.open {
                right: 0
            }

        .metric-info-drawer-head {
            padding: 14px;
            border-bottom: 1px solid var(--line);
            border-left: 0px solid var(--primaryLeft);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            background: #f8fbfe;
        }

            .metric-info-drawer-head h2 {
                margin: 0 0 4px;
                font-size: 19px
            }

        .metric-info-drawer-label {
            font-size: 12px;
            color: var(--muted)
        }

        .metric-info-drawer-body {
            overflow: auto;
            padding: 18px
        }

        .metric-info-text {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.55;
            color: var(--text)
        }

        .help-section h3 {
            margin: 0 0 7px;
            color: var(--primary)
        }

        @media(max-width:1100px) {
            .dashboard-grid.sections-3, .dashboard-grid.sections-5, .dashboard-grid.sections-6 {
                grid-template-columns: repeat(2,minmax(0,1fr))
            }
        }

        @media(max-width:900px) {
            .top-summary-row {
                grid-template-columns: minmax(0,1fr) 210px
            }
        }

        @media(max-width:700px) {
            .top-summary-row {
                grid-template-columns: 1fr
            }

            .dashboard-grid, .dashboard-grid.sections-1, .dashboard-grid.sections-2, .dashboard-grid.sections-3, .dashboard-grid.sections-4, .dashboard-grid.sections-5, .dashboard-grid.sections-6 {
                grid-template-columns: 1fr
            }

            .header {
                align-items: flex-start;
                flex-direction: column
            }

            .header-actions {
                margin-left: 0;
                flex-wrap: wrap
            }

            .qr {
                display: none
            }

            .kpi-row {
                grid-template-columns: 38px 1fr
            }

            .kpi-value {
                grid-column: 2;
                text-align: left
            }

            .kpi-compare {
                grid-template-columns: 1fr
            }
        }


        .score-card.active-index {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2,68,118,.16);
        }

            .score-card.active-index:hover {
                box-shadow: 0 0 0 3px rgba(2,68,118,.16), 0 5px 14px rgba(2,68,118,.18);
            }

            .score-card.active-index:not(.overall) .score-label {
                color: var(--primary);
            }
    </style>
</head>
<body>
    <header class="header"><div><h1 id="dashboardTitle">Loading...</h1><div class="subtitle" id="dashboardSubtitle"></div></div><div class="header-actions"><a id="sheetLink" class="sheet-link" target="_blank">Spreadsheet</a><button id="helpButton" class="how-button" onclick="toggleHelp()"><i class="fa-solid fa-calculator"></i> How Calculated</button><img id="qrCode" class="qr" alt="QR code"></div></header>
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeHelp()"></div><aside class="drawer" id="helpDrawer"><div class="drawer-head"><div><h2>How is this dashboard calculated?</h2><div class="subtitle" style="color:var(--muted)">Live documentation from the spreadsheet.</div></div><button class="detail-close" onclick="closeHelp()">×</button></div><div class="drawer-body" id="helpBody"></div></aside>
    <div class="metric-info-backdrop" id="metricInfoBackdrop" onclick="closeMetricInfo()"></div>
    <aside class="metric-info-drawer" id="metricInfoDrawer" aria-hidden="true">
        <div class="metric-info-drawer-head">
            <div><div class="metric-info-drawer-label" id="metricInfoType">Metric information</div><h2 id="metricInfoTitle">Metric</h2></div>
            <button type="button" class="detail-close" onclick="closeMetricInfo()" aria-label="Close metric information">×</button>
        </div>
        <div class="metric-info-drawer-body"><div id="metricInfoText" class="metric-info-text"></div></div>
    </aside>
    <main class="page"><section class="top-summary-row" id="topSummaryRow"><section class="card story-card" id="storyCard"><h2 id="storyTitle">Dashboard Story</h2><p id="boardStory"></p></section><section class="score-card briefing-summary-card" id="briefingSummaryCard" onclick="showBriefing()"><div class="score-label" id="briefingSummaryLabel">Briefing</div><div class="score-value" id="briefingSummaryCount">--</div><div class="score-note" id="briefingSummarySubtitle"></div></section></section><section class="score-row" id="scoreRow"></section><section class="card brief-card" id="briefCard" hidden><div class="detail-head"><div><h3 id="briefTitle"></h3><div class="subtitle" style="color:var(--muted)" id="briefSubtitle"></div></div><button class="detail-close" onclick="hideBriefing()">×</button></div><div class="brief-grid" id="briefGrid"></div></section><section class="card detail-card" id="detailCard" hidden><div class="detail-head"><div><div class="detail-title-row"><h3 id="detailTitle"></h3></div><div class="subtitle" style="color:var(--muted)" id="detailSub"></div></div><button class="detail-close" onclick="hideDetail()">×</button></div><div class="index-calculation" id="indexCalculationBreakdown"></div><div class="detail-chart-grid" id="detailChartGrid"></div></section><section class="dashboard-grid" id="dashboardGrid"></section><section class="card trend-card" id="trendCard"><h3>Trend</h3><canvas id="trendChart" height="95"></canvas></section><div class="footer-note" id="footerText"></div></main>
    <script>
        // Publish each worksheet as CSV, then paste its URL below.
        const SETTINGS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRn5uIMD9g4mkwL4xsuITEEbOsXrAFPHM7__gqhn9HHVGyTFkSRvlqeGwAwwWPdkpYOAMCBGux_8aTX/pub?gid=1633262554&single=true&output=csv';
        const SECTIONS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRn5uIMD9g4mkwL4xsuITEEbOsXrAFPHM7__gqhn9HHVGyTFkSRvlqeGwAwwWPdkpYOAMCBGux_8aTX/pub?gid=1895672496&single=true&output=csv';
        const DICTIONARY_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRn5uIMD9g4mkwL4xsuITEEbOsXrAFPHM7__gqhn9HHVGyTFkSRvlqeGwAwwWPdkpYOAMCBGux_8aTX/pub?gid=830408528&single=true&output=csv';
        const VALUES_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRn5uIMD9g4mkwL4xsuITEEbOsXrAFPHM7__gqhn9HHVGyTFkSRvlqeGwAwwWPdkpYOAMCBGux_8aTX/pub?gid=1509973590&single=true&output=csv';

            const detailCard = document.getElementById('detailCard');
            detailCard.hidden = false;

            if (window.innerWidth <= 700) {
                detailCard.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }
        function renderDetailCharts(parts) {
            destroyDetailCharts(); const grid = document.getElementById('detailChartGrid'); grid.innerHTML = parts.map((p, i) => `<div class="detail-mini-chart"><div class="detail-mini-chart-title">${esc(p.def.metric_label || p.rule.component_key)}</div><canvas id="detailChart${i}" height="170"></canvas></div>`).join(''); parts.forEach((p, i) => {
                const list = grouped[p.rule.component_key] || []; const unit = p.def.unit || 'number'; const c = new Chart(document.getElementById('detailChart' + i), {
                    type: 'line', data: { labels: list.map(r => r.snapshot_date), datasets: [{ label: p.def.metric_label || p.rule.component_key, data: list.map(r => n(r.value)), tension: .25 }] }, options: {
                        responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: {
                            y: {
                                beginAtZero: unit !== 'score' && unit !== 'percent',
                                min: unit === 'score' || unit === 'percent' ? 0 : undefined,
                                max: unit === 'score' || unit === 'percent' ? 100 : undefined,
                                ticks: {
                                    callback: value => {
                                        if (unit === 'percent') return value + '%';
                                        if (unit === 'score') return value + '/100';
                                        if (unit === 'currency') {
                                            return '$' + Number(value).toLocaleString();
                                        }
                                        return Number(value).toLocaleString();
                                    }
                                }
                            }
                        }
                    }
                }); detailCharts.push(c)
            })
        }
        function hideDetail() {
            document.getElementById('detailCard').hidden = true;
            destroyDetailCharts();

            activeIndexKey = null;

            document.querySelectorAll('.score-card[data-index-key]')
                .forEach(card => card.classList.remove('active-index'));
        }
        function renderBriefing() {
            const visibleBriefs = briefing
                .filter(b => String(b.show_on_dashboard || 'Y').toUpperCase() !== 'N')
                .sort((a, b) => dateNorm(b.event_date).localeCompare(dateNorm(a.event_date)));

            const showBriefing = String(settings.show_briefing || 'Y').toUpperCase() === 'Y';
            const summaryCard = document.getElementById('briefingSummaryCard');

            summaryCard.style.display = showBriefing ? 'flex' : 'none';
            document.getElementById('briefingSummaryLabel').textContent =
                settings.briefing_label || 'Briefing';
            document.getElementById('briefingSummaryCount').textContent =
                visibleBriefs.length + (visibleBriefs.length === 1 ? ' Item' : ' Items');
            document.getElementById('briefingSummarySubtitle').textContent =
                settings.briefing_subtitle || '';

            document.getElementById('briefTitle').textContent =
                settings.briefing_label || 'Briefing';
            document.getElementById('briefSubtitle').textContent =
                settings.briefing_subtitle || '';

            document.getElementById('briefGrid').innerHTML = visibleBriefs
                .map(b => `<div class="brief-item"><div class="brief-meta"><span>${esc(b.category)}</span><span>${esc(fmtDate(b.event_date))}</span></div><div class="brief-title">${esc(b.title)}</div><div class="brief-details">${esc(b.details)}</div></div>`)
                .join('');
        }

        function showBriefing() {
            const briefCard = document.getElementById('briefCard');
            briefCard.hidden = false;

            if (window.innerWidth <= 700) {
                briefCard.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }

        function hideBriefing() {
            document.getElementById('briefCard').hidden = true;
        }
        function renderTrend() { const card = document.getElementById('trendCard'); if (String(settings.show_trend || 'Y').toUpperCase() === 'N') { card.style.display = 'none'; return } const defs = systemMetrics(), dates = [...new Set(rows.filter(r => defs.some(d => d.metric_key === r.metric_key)).map(r => r.snapshot_date))].sort(); const datasets = defs.map(d => ({ label: d.metric_label, data: dates.map(dt => (grouped[d.metric_key] || []).find(r => r.snapshot_date === dt)?.value ?? null), tension: .25 })); chart = new Chart(document.getElementById('trendChart'), { type: 'line', data: { labels: dates, datasets }, options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { min: 0, max: 100 } } } }) }
        function renderHelp() { const sectionsHtml = sections.filter(s => String(s.show_on_dashboard).toUpperCase() !== 'N').map(s => `<p><strong>${esc(s.section_label)}:</strong> ${esc(s.question || '')}</p>`).join(''); document.getElementById('helpBody').innerHTML = `<section class="help-section"><h3>About this dashboard</h3><p>All labels, colors, sections, KPIs, goals, narratives, briefing items, and calculations come from the spreadsheet. Add or remove section rows and system index rows without changing this HTML file.</p></section><section class="help-section"><h3>Component score</h3><p>Index_Rules selects the scoring method. Target scoring compares current value with a goal. Linear scoring uses a defined minimum and maximum. Band scoring assigns a score from the matching Index_Bands range. Scores may be capped at 100.</p></section><section class="help-section"><h3>Current sections</h3>${sectionsHtml}</section><section class="help-section"><h3>Data model</h3><p>Dashboard_Settings controls appearance. Sections controls groups. Metric_Dictionary defines KPIs. Dashboard_Values stores dated values. Index_Rules defines calculations. Index_Bands defines ranges for band-scored components.</p></section>` }
        function toggleHelp() { document.getElementById('helpDrawer').classList.toggle('open'); document.getElementById('drawerBackdrop').classList.toggle('open') }
        function closeHelp() { document.getElementById('helpDrawer').classList.remove('open'); document.getElementById('drawerBackdrop').classList.remove('open') }

        function toggleMetricInfo(metricKey, event = null) {
            event?.preventDefault();
            event?.stopPropagation();

            const metric = dictionary[metricKey] || {};
            const info = String(metric.info || '').trim();

            if (!info) return;

            toggleInfoDrawer(
                'metric:' + metricKey,
                metric.metric_label || metricKey,
                info,
                'Metric information',
                event
            );
        }

        function toggleInfoDrawer(infoKey, title, info, typeLabel, event) {
            event?.stopPropagation();

            const drawer = document.getElementById('metricInfoDrawer');

            if (drawer.classList.contains('open') && activeMetricInfoKey === infoKey) {
                closeMetricInfo();
                return;
            }

            activeMetricInfoKey = infoKey;
            document.getElementById('metricInfoType').textContent = typeLabel || 'Information';
            document.getElementById('metricInfoTitle').textContent = title;
            document.getElementById('metricInfoText').textContent = String(info || '').trim();
            drawer.classList.add('open');
            drawer.setAttribute('aria-hidden', 'false');
            document.getElementById('metricInfoBackdrop').classList.add('open');
        }

        function closeMetricInfo() {
            activeMetricInfoKey = null;
            document.getElementById('metricInfoDrawer').classList.remove('open');
            document.getElementById('metricInfoDrawer').setAttribute('aria-hidden', 'true');
            document.getElementById('metricInfoBackdrop').classList.remove('open');
        }

        document.addEventListener('click', event => {
            const indexButton = event.target.closest('[data-index-info-key]');

            if (indexButton) {
                event.preventDefault();
                event.stopPropagation();

                const key = indexButton.dataset.indexInfoKey;
                const indexInfo = infoForIndex(key);

                if (indexInfo) {
                    toggleInfoDrawer(
                        'index:' + key,
                        indexInfo.title,
                        indexInfo.info,
                        indexInfo.type,
                        event
                    );
                }
                return;
            }

            const sectionLink = event.target.closest('[data-section-info-key]');

            if (sectionLink) {
                event.preventDefault();
                event.stopPropagation();

                const key = sectionLink.dataset.sectionInfoKey;
                const section = sections.find(s =>
                    String(s.section_key || '').trim() === String(key || '').trim()
                );
                const info = String(section?.info || '').trim();

                if (section && info) {
                    toggleInfoDrawer(
                        'section:' + key,
                        section.section_label || section.section_key,
                        info,
                        'Section information',
                        event
                    );
                }
                return;
            }

            const metricButton = event.target.closest('[data-metric-info-key]');

            if (!metricButton) return;
            if (metricButton.closest('#indexCalculationBreakdown')) return;

            toggleMetricInfo(
                metricButton.dataset.metricInfoKey,
                event
            );
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') { closeMetricInfo(); closeHelp(); }
        });

        async function init() { try { [settings, sections, dictRows, rows, rules, bands, narrative, briefing] = await Promise.all([fetchCsv(SETTINGS_CSV_URL), fetchCsv(SECTIONS_CSV_URL), fetchCsv(DICTIONARY_CSV_URL), fetchCsv(VALUES_CSV_URL), fetchCsv(RULES_CSV_URL), fetchOptionalCsv(INDEX_BANDS_CSV_URL), fetchCsv(NARRATIVE_CSV_URL), fetchCsv(BRIEFING_CSV_URL)]); dictionary = dictRows; prepare(); render() } catch (e) { document.querySelector('.page').innerHTML = `<div class="card"><h2>Dashboard could not load</h2><p>${esc(e.message)}</p><p>Publish each worksheet as CSV and replace the worksheet URL placeholders near the top of the script.</p></div>` } }


        function toggleDetail(key) {
            const detailCard = document.getElementById('detailCard');

            if (activeIndexKey === key && !detailCard.hidden) {
                hideDetail();
                return;
            }

            activeIndexKey = key;

            document.querySelectorAll('.score-card[data-index-key]')
                .forEach(card => {
                    card.classList.toggle(
                        'active-index',
                        card.dataset.indexKey === key
                    );
                });

            showDetail(key);
        }


        init();
    </script>
</body>
</html>
