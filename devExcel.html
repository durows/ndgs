<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>NDGS Excel Test</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        pre {
            background: #f4f4f4;
            border: 1px solid #ddd;
            padding: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>NDGS Excel Test</h2>

<div id="status">
    Loading workbook...
</div>

<pre id="output"></pre>

<script>

const EXCEL_URL =
    'https://fargopublicschooldistrict-my.sharepoint.com/:x:/g/personal/durows_fargo365_org/IQDz7erGSdcPT6Atp2WlNV8dAWHV7uvg1beHivIafFwFtFI?e=06XcLj&download=1';


async function testExcel() {

    const status =
        document.getElementById('status');

    const output =
        document.getElementById('output');


    try {

        status.textContent =
            'Downloading Excel workbook...';


        const response =
            await fetch(EXCEL_URL);


        if (!response.ok) {

            throw new Error(
                'HTTP ' + response.status
            );

        }


        const buffer =
            await response.arrayBuffer();


        status.textContent =
            'Reading workbook...';


        const workbook =
            XLSX.read(
                buffer,
                {
                    type: 'array'
                }
            );


        status.textContent =
            'SUCCESS';


        output.textContent =
            'Workbook bytes: ' +
            buffer.byteLength.toLocaleString() +
            '\n\n' +
            'Worksheets:\n' +
            workbook.SheetNames
                .map(name => '• ' + name)
                .join('\n');


    }
    catch (error) {

        console.error(error);

        status.textContent =
            'FAILED';

        output.textContent =
            error.message;

    }

}


testExcel();

</script>

</body>
</html>
